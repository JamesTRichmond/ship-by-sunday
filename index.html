<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ship by Sunday</title>
  <meta name="description" content="Ship by Sunday — join the waitlist." />
  <style>
    :root { color-scheme: light dark; --fg: #111; --muted: #555; --bg: #fafafa; --card: #fff; --accent: #0b57d0; --border: #e5e5e5; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #f2f2f2; --muted: #a8a8a8; --bg: #0d0d0d; --card: #161616; --accent: #8ab4f8; --border: #2a2a2a; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--fg); padding: 1.5rem;
    }
    main {
      width: min(36rem, 100%); background: var(--card); border: 1px solid var(--border);
      border-radius: 1rem; padding: 2rem; box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }
    h1 { margin: 0 0 .5rem; font-size: 1.75rem; letter-spacing: -0.02em; }
    p { margin: 0 0 1.25rem; color: var(--muted); line-height: 1.5; }
    a.cta {
      display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
      font-weight: 600; padding: .75rem 1.1rem; border-radius: .6rem;
    }
    a.cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .note { margin-top: 1.25rem; font-size: .875rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Ship by Sunday</h1>
    <p>Placeholder lander. Product code stays frozen until burn opens. Join the waitlist — free, no account required beyond GitHub.</p>
    <a class="cta" href="https://github.com/JamesTRichmond/ship-by-sunday/issues/new?template=waitlist.yml">Join the waitlist</a>
    <p class="note">Waitlist opens a GitHub issue on this repo.</p>
  </main>
</body>
</html>
